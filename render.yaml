# Render Blueprint.
#
# ÖNEMLİ: Ücretsiz katmanda disk kalıcı DEĞİLDİR. Rapor, önbellek ve oylar
# bu yüzden veritabanına yazılır. `DATABASE_URL` Render panelinde zaten
# tanımlı (Supabase Postgres) olduğu için burada `sync: false` ile
# bırakılıyor — blueprint uygulanırsa mevcut değer korunur, yeni bir
# veritabanı oluşturulmaz.
#
# DATABASE_URL tanımlı olmazsa uygulama SQLite'a düşer ve çalışmaya devam
# eder; ancak her yeniden başlatmada rapor ve oylar sıfırlanır.

services:
  - type: web
    name: halka-irz
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -c gunicorn.conf.py wsgi:app
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: PYTHONUNBUFFERED
        value: "1"
      # Zamanlayıcı: canlı tutma pingi + akşam 21:00 (TR) yenilemesi.
      - key: RUN_SCHEDULER
        value: "1"
      - key: WEB_THREADS
        value: "8"
      # Panelde tanımlı Supabase bağlantısı korunur.
      - key: DATABASE_URL
        sync: false
